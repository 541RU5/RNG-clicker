<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNG Pets Ultimate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#fff}.container{max-width:1200px;margin:0 auto}.title{text-align:center;font-size:48px;font-weight:bold;margin-bottom:30px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:30px}.stat{background:rgba(255,255,255,.15);border-radius:15px;padding:20px;text-align:center;border:2px solid rgba(255,255,255,.2)}.stat-label{font-size:14px;opacity:.8;margin-bottom:8px}.stat-value{font-size:32px;font-weight:bold}.btn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.3);color:#fff;padding:12px 24px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .3s}.btn:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}.btn-click{background:linear-gradient(135deg,#f093fb,#f5576c);border:none;font-size:24px;padding:20px;width:100%;margin-bottom:30px}.section{background:rgba(255,255,255,.1);border-radius:20px;padding:25px;margin-bottom:25px;border:2px solid rgba(255,255,255,.2)}.section-title{font-size:24px;font-weight:bold;margin-bottom:20px}.eggs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.egg{background:rgba(255,255,255,.15);border-radius:15px;padding:20px;text-align:center;cursor:pointer;transition:all .3s;border:2px solid rgba(255,255,255,.2)}.egg:hover{transform:scale(1.05);background:rgba(255,255,255,.25)}.egg.locked{opacity:.5;cursor:not-allowed}.egg-icon{font-size:60px;margin-bottom:10px}.egg-name{font-size:18px;font-weight:bold;margin-bottom:5px}.egg-cost{font-size:14px;opacity:.8}.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;max-height:400px;overflow-y:auto}.pet{background:rgba(255,255,255,.15);border-radius:12px;padding:15px;text-align:center;cursor:pointer;transition:all .3s;border:2px solid transparent;position:relative}.pet:hover{transform:translateY(-5px)}.pet.equipped{border-color:#4ecdc4;box-shadow:0 0 20px rgba(78,205,196,.6)}.pet-emoji{font-size:48px;margin-bottom:10px}.pet-name{font-size:14px;font-weight:bold;margin-bottom:5px}.pet-mult{font-size:12px;color:#4ecdc4}.pet-count{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.3);padding:4px 8px;border-radius:12px;font-size:12px;font-weight:bold}.rarity-common{border-left:4px solid #9dff9d}.rarity-rare{border-left:4px solid #5aa9ff}.rarity-epic{border-left:4px solid #d38cff}.rarity-legend{border-left:4px solid #ffae42}.rarity-secret{border-left:4px solid #ff6b6b}.rarity-divine{border-left:4px solid #ffd700}.rarity-exclusive{border-left:4px solid #7f00ff}.equipped-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.slot{background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.3);border-radius:12px;padding:20px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}.slot.filled{background:rgba(78,205,196,.2);border:2px solid #4ecdc4}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000}.modal-box{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;padding:40px;text-align:center;max-width:400px;border:3px solid}.modal-emoji{font-size:100px;margin-bottom:20px}.modal-name{font-size:32px;font-weight:bold;margin-bottom:10px}.modal-rarity{font-size:16px;text-transform:uppercase;letter-spacing:2px;margin-bottom:15px}.modal-mult{font-size:24px;color:#4ecdc4;margin-bottom:20px}.flash{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;opacity:0;pointer-events:none;z-index:999;transition:opacity .3s}.flash.active{opacity:.3}.index-pet{background:rgba(255,255,255,.1);padding:12px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid}.index-pet.hidden{opacity:.4;filter:blur(2px)}.ach{background:rgba(255,255,255,.1);padding:15px;border-radius:12px;border-left:4px solid;margin-bottom:10px}.ach.unlocked{border-color:#4ecdc4;background:rgba(78,205,196,.2)}.ach.locked{border-color:#666;opacity:.6}.ach-icon{font-size:32px;margin-bottom:8px}.ach-name{font-weight:bold;margin-bottom:5px}.ach-desc{font-size:12px;opacity:.8}.code-input{display:flex;gap:10px;margin-bottom:15px}.code-input input{flex:1;padding:12px;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px}.code-result{padding:10px;border-radius:8px;margin-top:10px;text-align:center;display:none}.code-result.show{display:block}.code-result.success{background:rgba(78,205,196,.3);border:2px solid #4ecdc4}.code-result.error{background:rgba(255,107,107,.3);border:2px solid #ff6b6b}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="container">
<h1 class="title">🎮 RNG PETS ULTIMATE</h1>
<div class="stats">
<div class="stat"><div class="stat-label">💰 Clicks</div><div class="stat-value" id="clicks">0</div></div>
<div class="stat"><div class="stat-label">⚡ Multiplicador</div><div class="stat-value" id="mult">x1</div></div>
<div class="stat"><div class="stat-label">🍀 Suerte</div><div class="stat-value" id="luck">x1.0</div></div>
<div class="stat"><div class="stat-label">🔄 Rebirths</div><div class="stat-value" id="reb">0</div></div>
</div>
<button class="btn btn-click" onclick="G.click();return false;">🖱️ ¡CLICK AQUÍ!</button>
<div class="section"><div class="section-title">🥚 Huevos</div><div class="eggs" id="eggs"></div></div>
<div class="section"><div class="section-title">✨ Equipadas (<span id="eqc">0</span>/3)</div><div style="display:flex;gap:10px;margin-bottom:15px"><button class="btn" onclick="G.equipBest()">⚡ Equipar Mejores</button><button class="btn" onclick="G.unequipAll()">❌ Desequipar Todo</button></div><div class="equipped-slots" id="equipped"></div></div>
<div class="section"><div class="section-title">🎒 Inventario (<span id="invc">0</span>)</div><div style="display:flex;gap:10px;margin-bottom:15px"><button class="btn" onclick="G.toggleSell()" id="sellBtn">🗑️ Modo Venta</button><button class="btn" onclick="G.sellDups()">📦 Vender Duplicados</button></div><div class="pets" id="inv"></div></div>
<div class="section"><div class="section-title">📚 Índice de Mascotas</div><div style="max-height:500px;overflow-y:auto" id="index"></div></div>
<div class="section"><div class="section-title">🏆 Logros (<span id="achc">0</span>/16)</div><div id="achs"></div></div>
<div class="section"><div class="section-title">🎁 Códigos</div><div class="code-input"><input type="text" id="codeIn" placeholder="Código..." maxlength="20"><button class="btn" onclick="G.redeem()">Canjear</button></div><div id="codeRes" class="code-result"></div></div>
<div class="section"><div class="section-title">🔄 Rebirth</div><div style="background:rgba(255,255,255,.1);padding:15px;border-radius:10px;margin-bottom:15px"><strong>💎 Costo:</strong> <span id="rebCost">1,000,000</span> clicks<br><strong>🎁 Beneficios:</strong> +<span id="rebRew">2,000</span> clicks, +<span id="rebMult">2,000</span>x Mult permanente, x1.5 Suerte</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="G.rebirth(1)">1 Rebirth</button><button class="btn" onclick="G.rebirth(2)">2 Rebirths</button><button class="btn" onclick="G.rebirth(5)">5 Rebirths</button><button class="btn" onclick="G.rebirth(10)">10 Rebirths</button></div></div>
</div>
<script>
const D={basic:{n:'Básico',i:'🥚',c:30,p:[{n:'Gato',e:'🐱',ch:40,m:1,r:'common'},{n:'Perro',e:'🐶',ch:30,m:2,r:'rare'},{n:'Muñeco de nieve',e:'⛄',ch:24.9,m:5,r:'epic'},{n:'Cerberus',e:'🐺',ch:5,m:10,r:'legend'},{n:'Estrella cósmica',e:'⭐',ch:.01,m:1000000,r:'secret'}]},magma:{n:'Magma',i:'🔥',c:2000,p:[{n:'Lagarto magma',e:'🦎',ch:45,m:15,r:'common'},{n:'Babosa magma',e:'🐌',ch:30,m:25,r:'rare'},{n:'Dragón magma',e:'🐲',ch:20,m:75,r:'epic'},{n:'Carga ígnea',e:'🔥',ch:5,m:125,r:'legend'},{n:'Volcán',e:'🌋',ch:.01,m:3000000,r:'secret'}]},forest:{n:'Bosque',i:'🌲',c:100000,p:[{n:'Ardilla',e:'🐿️',ch:40,m:2000,r:'common'},{n:'Lobo',e:'🐺',ch:30,m:3000,r:'rare'},{n:'Búho',e:'🦉',ch:25,m:5550,r:'epic'},{n:'Dark Tree',e:'🌳',ch:5,m:15000,r:'legend'},{n:'Enanito',e:'🧙',ch:.01,m:7000000,r:'secret'}]},sea:{n:'Mar',i:'🌊',c:5000000,p:[{n:'Pez payaso',e:'🐠',ch:45,m:60000,r:'common'},{n:'Delfín',e:'🐬',ch:30,m:100000,r:'rare'},{n:'Cocodrilo',e:'🐊',ch:15,m:150000,r:'epic'},{n:'Medusa rosa',e:'🪼',ch:9,m:250000,r:'legend'},{n:'Tiburón naranja',e:'🦈',ch:1,m:800000,r:'legend'},{n:'Leviatán',e:'🐋',ch:.01,m:30000000,r:'secret'},{n:'Dios del océano',e:'🔱',ch:.0001,m:5000000000,r:'divine'}]},void:{n:'Vacío',i:'⬛',c:100000000,p:[{n:'Void Slime',e:'🟣',ch:45,m:5000000,r:'common'},{n:'Void Bat',e:'🦇',ch:35,m:9000000,r:'rare'},{n:'Void Hound',e:'🐕',ch:20,m:15000000,r:'rare'},{n:'Void Mage',e:'🧙',ch:9,m:30000000,r:'epic'},{n:'Void Titan',e:'👹',ch:1,m:80000000,r:'legend'},{n:'Void Eye',e:'👁️',ch:.01,m:200000000,r:'secret'},{n:'Void God',e:'⚫',ch:.00001,m:1000000000,r:'divine'}]}};const RC={common:'#9dff9d',rare:'#5aa9ff',epic:'#d38cff',legend:'#ffae42',secret:'#ff6b6b',divine:'#ffd700',exclusive:'#7f00ff'};const A=[{id:'c1',n:'Primer Click',d:'Haz tu primer click',i:'🖱️',f:g=>g.tc>=1},{id:'c100',n:'Clicker',d:'100 clicks',i:'👆',f:g=>g.cl>=100},{id:'p1',n:'Primera Mascota',d:'Obtén tu primera',i:'🐾',f:g=>Object.keys(g.inv).length>=1},{id:'p10',n:'Coleccionista',d:'10 mascotas',i:'📦',f:g=>Object.keys(g.inv).length>=10},{id:'p20',n:'Maestro',d:'20 mascotas',i:'🏆',f:g=>Object.keys(g.inv).length>=20},{id:'r1',n:'Rara',d:'Obtén rara+',i:'✨',f:g=>Object.values(g.inv).some(p=>['rare','epic','legend','secret','divine'].includes(p.d.r))},{id:'l1',n:'Legendario',d:'Obtén legendaria',i:'🌟',f:g=>Object.values(g.inv).some(p=>['legend','secret','divine'].includes(p.d.r))},{id:'s1',n:'Secreto',d:'Obtén secreta',i:'🎭',f:g=>Object.values(g.inv).some(p=>['secret','divine'].includes(p.d.r))},{id:'d1',n:'Divina',d:'Obtén divina',i:'👑',f:g=>Object.values(g.inv).some(p=>p.d.r==='divine')},{id:'rb1',n:'Renacimiento',d:'1er rebirth',i:'🔄',f:g=>g.rb>=1},{id:'rb10',n:'Renacido',d:'10 rebirths',i:'♻️',f:g=>g.rb>=10},{id:'m1k',n:'Súper Mult',d:'x1000',i:'⚡',f:g=>g.getMult()>=1000},{id:'c1m',n:'Millonario',d:'1M clicks',i:'💰',f:g=>g.cl>=1000000},{id:'c1b',n:'Billonario',d:'1B clicks',i:'💎',f:g=>g.cl>=1000000000},{id:'ab',n:'Básico OK',d:'Todas básico',i:'🥚',f:g=>D.basic.p.every(p=>g.dis.has(p.n))},{id:'aa',n:'Pokédex',d:'Todas',i:'📚',f:g=>Object.values(D).flatMap(e=>e.p).every(p=>g.dis.has(p.n))}];const C={'RELEASE':{t:'clicks',v:10000,m:'¡+10,000 clicks!'},'MEGABOOST':{t:'mult',v:5,m:'¡+5x mult!'},'LUCKYSTART':{t:'luck',v:2,m:'¡+2x suerte!'},'SAIRUS':{t:'pet',v:{n:'Sairus',e:'🥨',m:0,r:'exclusive'},m:'¡Sairus obtenido! Da 60% más que tu mejor mascota'},'CHRISTMAS':{t:'combo',v:{clicks:1000000,pet:{n:'Santa Claus',e:'🎅🏻',m:5000,r:'exclusive'}},m:'¡+1M clicks y Santa Claus obtenido!'}};class Game{constructor(){this.cl=0;this.tc=0;this.rb=0;this.pm=1;this.lm=1;this.inv={};this.eq=[];this.dis=new Set();this.ach=new Set();this.cod=new Set();this.sell=false;this.load();this.render();setInterval(()=>this.save(),10000)}click(){this.cl+=this.getMult();this.tc++;this.checkAch();this.render();return false}getMult(){let t=this.pm;this.eq.forEach(p=>{if(p.n==='Sairus'){const best=this.getBestPetMult();t+=best*0.6}else{t+=p.m}});return t}getBestPetMult(){if(this.eq.length===0)return 0;return Math.max(...this.eq.filter(p=>p.n!=='Sairus').map(p=>p.m))}async openEgg(k){const eg=D[k];if(this.cl<eg.c)return;this.cl-=eg.c;this.render();const m=this.modal(<div class="modal-emoji">${eg.i}</div><div style="font-size:24px">Abriendo...</div>);await this.wait(800);const pt=this.roll(eg.p);this.addInv(pt);this.dis.add(pt.n);this.checkAch();m.innerHTML=<div class="modal-box" style="border-color:${RC[pt.r]}"><div class="modal-emoji">${pt.e}</div><div class="modal-name">${pt.n}</div><div class="modal-rarity" style="color:${RC[pt.r]}">${pt.r.toUpperCase()}</div><div class="modal-mult">+${pt.m.toLocaleString()}x</div><button class="btn" onclick="this.closest('.modal').remove()">¡OK!</button></div>;this.flash();this.render();this.save()}roll(pets){const r=Math.random()100/this.lm;let a=0;for(const p of pets){a+=p.ch;if(r<=a)return{...p}}return{...pets[0]}}addInv(p){if(!this.inv[p.n])this.inv[p.n]={d:p,c:0};this.inv[p.n].c++}toggleEq(n){if(this.sell){this.sellPet(n);return}const petInv=this.inv[n];if(!petInv)return;const equippedCount=this.eq.filter(p=>p.n===n).length;if(equippedCount>0&&equippedCount>=petInv.c){const idx=this.eq.findIndex(p=>p.n===n);if(idx>=0)this.eq.splice(idx,1)}else{if(this.eq.length>=3)return;if(equippedCount<petInv.c){this.eq.push({n:petInv.d.n,m:petInv.d.m,r:petInv.d.r,e:petInv.d.e})}}this.render();this.save()}equipBest(){this.eq=[];const allPets=[];Object.values(this.inv).forEach(p=>{for(let i=0;i<p.c;i++){allPets.push({n:p.d.n,m:p.d.m,r:p.d.r,e:p.d.e})}});allPets.sort((a,b)=>b.m-a.m);this.eq=allPets.slice(0,3);this.render();this.save()}unequipAll(){this.eq=[];this.render();this.save()}toggleSell(){this.sell=!this.sell;document.getElementById('sellBtn').textContent=this.sell?'❌ Cancelar':'🗑️ Modo Venta';this.render()}sellPet(n){if(!this.sell||!this.inv[n])return;const p=this.inv[n];const v=p.d.m*p.c.75;this.cl+=v;delete this.inv[n];this.eq=this.eq.filter(e=>e.n!==n);this.render();this.save()}sellDups(){let t=0;for(const k in this.inv){const p=this.inv[k];if(p.c>1){const s=p.c-1;t+=p.d.m*s*.75;p.c=1}}this.cl+=t;this.render();this.save()}getRebCost(){return 1000000*Math.pow(2.5,this.rb)}getRebRew(){return 2000*Math.pow(1.5,this.rb)}rebirth(n){const cost=this.getRebCost()n;if(this.cl<cost)return;let totalRew=0;let totalMult=0;for(let i=0;i<n;i++){totalRew+=2000*Math.pow(1.5,this.rb+i);totalMult+=2000*Math.pow(1.5,this.rb+i)}this.cl=totalRew;this.rb+=n;this.pm+=totalMult;this.lm=Math.pow(1.5,n);this.flash();this.checkAch();this.render();this.save()}redeem(){const inp=document.getElementById('codeIn');const code=inp.value.toUpperCase().trim();const res=document.getElementById('codeRes');if(!code){res.className='code-result error show';res.textContent='Ingresa código';return}if(this.cod.has(code)){res.className='code-result error show';res.textContent='Ya usado';return}const cd=C[code];if(!cd){res.className='code-result error show';res.textContent='Inválido';return}this.cod.add(code);if(cd.t==='clicks')this.cl+=cd.v;if(cd.t==='mult')this.pm+=cd.v;if(cd.t==='luck')this.lm+=cd.v;if(cd.t==='pet'){this.addInv(cd.v);this.dis.add(cd.v.n)}if(cd.t==='combo'){this.cl+=cd.v.clicks;this.addInv(cd.v.pet);this.dis.add(cd.v.pet.n)}res.className='code-result success show';res.textContent=cd.m;inp.value='';this.render();this.save();setTimeout(()=>res.className='code-result',3000)}checkAch(){A.forEach(a=>{if(!this.ach.has(a.id)&&a.f(this)){this.ach.add(a.id);this.notify(🏆 ${a.n})}})}notify(m){const n=document.createElement('div');n.style.cssText='position:fixed;top:20px;right:20px;background:rgba(78,205,196,.9);padding:15px 20px;border-radius:10px;z-index:2000;font-weight:bold';n.textContent=m;document.body.appendChild(n);setTimeout(()=>n.remove(),3000)}render(){document.getElementById('clicks').textContent=Math.floor(this.cl).toLocaleString();document.getElementById('mult').textContent='x'+Math.floor(this.getMult()).toLocaleString();document.getElementById('luck').textContent='x'+this.lm.toFixed(1);document.getElementById('reb').textContent=this.rb;document.getElementById('rebCost').textContent=Math.floor(this.getRebCost()).toLocaleString();document.getElementById('rebRew').textContent=Math.floor(this.getRebRew()).toLocaleString();document.getElementById('rebMult').textContent=Math.floor(this.getRebRew()).toLocaleString();let eh='';Object.keys(D).forEach(k=>{const e=D[k];const ok=this.cl>=e.c;eh+=<div class="egg ${ok?'':'locked'}" onclick="G.openEgg('${k}')"><div class="egg-icon">${e.i}</div><div class="egg-name">${e.n}</div><div class="egg-cost">${e.c.toLocaleString()}</div></div>});document.getElementById('eggs').innerHTML=eh;document.getElementById('eqc').textContent=this.eq.length;let eqh='';for(let i=0;i<3;i++){const p=this.eq[i];if(p){const mult=p.n==='Sairus'?(this.getBestPetMult()*0.6):p.m;eqh+=<div class="slot filled"><div style="font-size:48px">${p.e}</div><div style="font-weight:bold">${p.n}</div><div style="color:#4ecdc4">${p.n==='Sairus'?'60% mejor':+${mult.toLocaleString()}x`}</div></div>}else eqh+=<div class="slot">Vacío</div>}document.getElementById('equipped').innerHTML=eqh;const ic=Object.keys(this.inv).length;document.getElementById('invc').textContent=ic;if(ic===0)document.getElementById('inv').innerHTML='<div style="text-align:center;padding:40px;opacity:.6">Sin mascotas</div>';else{let ih='';Object.values(this.inv).forEach(p=>{const eqCount=this.eq.filter(e=>e.n===p.d.n).length;ih+=<div class="pet rarity-${p.d.r} ${eqCount>0?'equipped':''}" onclick="G.toggleEq('${p.d.n}')"><div class="pet-count">x${p.c}</div>${eqCount>0?<div style="position:absolute;top:8px;left:8px;background:#4ecdc4;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:bold">${eqCount}E</div>:''}<div class="pet-emoji">${p.d.e}</div><div class="pet-name">${p.d.n}</div><div class="pet-mult">${p.d.n==='Sairus'?'60% mejor':+${p.d.m.toLocaleString()}x}</div></div>});document.getElementById('inv').innerHTML=ih}let idxh='';Object.keys(D).forEach(k=>{const e=D[k];idxh+=<div style="font-size:18px;font-weight:bold;color:#4ecdc4;margin:15px 0 10px">${e.n.toUpperCase()}</div>;e.p.forEach(p=>{const found=this.dis.has(p.n);const nm=found?p.n:'???';idxh+=<div class="index-pet ${found?'':'hidden'}" style="border-color:${RC[p.r]}"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">${found?p.e:'❓'}</span><span>${nm}</span></div><div style="opacity:.7">${p.ch}%</div></div>})});document.getElementById('index').innerHTML=idxh;document.getElementById('achc').textContent=this.ach.size;let ah='';A.forEach(a=>{const ok=this.ach.has(a.id);ah+=<div class="ach ${ok?'unlocked':'locked'}"><div class="ach-icon">${a.i}</div><div class="ach-name">${a.n}</div><div class="ach-desc">${a.d}</div></div>});document.getElementById('achs').innerHTML=ah}modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=<div class="modal-box">${h}</div>`;document.body.appendChild(m);return m}flash(){const f=document.getElementById('flash');f.classList.add('active');setTimeout(()=>f.classList.remove('active'),300)}wait(ms){return new Promise(r=>setTimeout(r,ms))}save(){const d={cl:this.cl,tc:this.tc,rb:this.rb,pm:this.pm,lm:this.lm,inv:this.inv,eq:this.eq,dis:Array.from(this.dis),ach:Array.from(this.ach),cod:Array.from(this.cod)};localStorage.setItem('rngPets',JSON.stringify(d))}load(){const s=localStorage.getItem('rngPets');if(s){const d=JSON.parse(s);this.cl=d.cl||0;this.tc=d.tc||0;this.rb=d.rb||0;this.pm=d.pm||1;this.lm=d.lm||1;this.inv=d.inv||{};this.eq=d.eq||[];this.dis=new Set(d.dis||[]);this.ach=new Set(d.ach||[]);this.cod=new Set(d.cod||[])}}}const G=new Game();
</script>
</body>
</html>
